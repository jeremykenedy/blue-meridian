name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Build, tests, and coverage
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"
      - name: Run host tests
        run: bash test.sh
      - name: Enforce installer line and branch coverage
        run: bash scripts/test-python-coverage.sh
      - name: Enforce Java line and branch coverage
        run: bash scripts/test-coverage.sh
      - name: Build and validate APK
        run: |
          SIGN_APK=false bash build.sh
          AAPT="$ANDROID_HOME/build-tools/36.0.0/aapt"
          BADGING=$("$AAPT" dump badging build/blue-meridian.apk)
          MANIFEST=$("$AAPT" dump xmltree build/blue-meridian.apk AndroidManifest.xml)
          PERMISSIONS=$("$AAPT" dump permissions build/blue-meridian.apk)
          printf '%s' "$BADGING" | grep -Fq "name='com.jeremykenedy.bluemeridian' versionCode='1' versionName='1.0.0'"
          printf '%s' "$BADGING" | grep -Fq "uses-gl-es: '0x20000'"
          for required in '.BlueMeridianDreamService' 'android.permission.BIND_DREAM_SERVICE' \
            'android.service.dreams.DreamService' 'android.service.dream' \
            '.SettingsActivity' \
            'com.jeremykenedy.bluemeridian.settings'; do
            printf '%s' "$MANIFEST" | grep -Fq "$required"
          done
          "$AAPT" list build/blue-meridian.apk | grep -Fq 'screensaver_preview.jpg'
          if printf '%s' "$PERMISSIONS" | grep -q android.permission.INTERNET; then
            echo 'The screensaver must not request network access.' >&2
            exit 1
          fi
